[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dappertable"
dynamic = ["version"]
description = "Print python formatted tables"
authors = [
    {name = "Tyler D. North", email = "me@tyler-north.com"},
]
dependencies = [
    "wcwidth==0.9.3",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "tox==4.67.4",
    "pylint==4.1.3",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "bandit==1.9.4",
]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
exclude = ["tests"]
