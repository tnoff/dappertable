name: CI

# Pull-request checks, ported from .gitlab-ci.yml. Shared jobs come from
# tnoff/github-workflows, SHA-pinned the same way the GitLab `include:` refs
# were; Renovate's github-actions manager keeps the pins current.

on:
  pull_request:

# One in-flight run per PR. Renovate force-pushes on rebase
# (rebaseWhen: behind-base-branch), and without this every rebase leaves its
# predecessor running to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Scan for secrets
    uses: tnoff/github-workflows/.github/workflows/trufflehog.yml@8ef2b98ffb32c908bb2c374ae3e930bb23ba98e4

  spellcheck:
    name: Spellcheck
    uses: tnoff/github-workflows/.github/workflows/spellcheck.yml@8ef2b98ffb32c908bb2c374ae3e930bb23ba98e4

  # extra_apt is deliberately empty. The GitLab job ran on the pre-baked
  # ci-base-images (build-essential, git, ffmpeg, postgresql), but that image
  # was the fleet-wide Python base rather than this repo's requirement --
  # dappertable depends on wcwidth and a pure-Python test extra, nothing that
  # needs a system library.
  tox:
    name: Tox
    uses: tnoff/github-workflows/.github/workflows/tox.yml@8ef2b98ffb32c908bb2c374ae3e930bb23ba98e4

  bump-version:
    name: Bump version
    # Matches the GitLab rule. The dev- prefix comes from the shared python
    # preset and is load-bearing: it is what decides whether an update bumps
    # VERSION, writes a changelog fragment, and therefore cuts a release.
    if: startsWith(github.head_ref, 'renovate/dev-')
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/bump-version.yml@8ef2b98ffb32c908bb2c374ae3e930bb23ba98e4
    with:
      bump_changelog: true
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  # Catches a `uses:` whose inputs or secrets no longer match the pinned callee.
  # That mismatch fails the calling workflow at STARTUP -- no job is created, no
  # check reports, and no `workflow_run` event fires -- so neither this checks
  # list nor notify-failure.yml can see it. It is how one upstream secret rename
  # left `Release` dead in nine repos for five days in September 2026.
  contracts:
    name: Workflow contracts
    uses: tnoff/github-workflows/.github/workflows/check-workflow-contracts.yml@8ef2b98ffb32c908bb2c374ae3e930bb23ba98e4

  result:
    name: CI result
    # The stable name for the branch ruleset to require.
    #
    # Requiring the individual jobs by name does not gate anything: GitHub
    # scores a `skipped` required check as SUCCESS, and every shared workflow
    # here carries an `allow_fork_prs` gate that can skip its only job. Tox's
    # matrix is worse -- the legs come from `tox -l` at runtime, so naming
    # `tox (3.13)` couples the ruleset to a file in a different repo.
    #
    # This job always runs and its name never changes, so the ruleset requires
    # exactly one context and the jobs underneath stay free to change.
    if: always()
    needs: [secrets, spellcheck, tox, contracts]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Summarise
        run: |
          echo "secrets:    ${{ needs.secrets.result }}"
          echo "spellcheck: ${{ needs.spellcheck.result }}"
          echo "tox:        ${{ needs.tox.result }}"
          echo "contracts:  ${{ needs.contracts.result }}"

      - name: Fail if any job failed
        # `skipped` is deliberately allowed: with allow_fork_prs false a fork
        # PR skips the cascade, which is the intended outcome, not a failure.
        if: >-
          needs.secrets.result == 'failure' || needs.secrets.result == 'cancelled' ||
          needs.spellcheck.result == 'failure' || needs.spellcheck.result == 'cancelled' ||
          needs.tox.result == 'failure' || needs.tox.result == 'cancelled' ||
          needs.contracts.result == 'failure' || needs.contracts.result == 'cancelled'
        run: |
          echo "::error::One or more CI jobs did not pass."
          exit 1
